name: SEO QA and Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  seo-qa:
    name: Automated SEO QA & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        working-directory: ./artifacts/tools-website
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ./artifacts/tools-website
        run: pnpm typecheck

      - name: Build & Prerender Static Pages
        working-directory: ./artifacts/tools-website
        run: pnpm build:hostinger

      - name: Run Master SEO QA Suite
        working-directory: ./artifacts/tools-website
        run: pnpm seo:audit
